<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de 1RM</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17191c;
      --muted: #686d73;
      --line: #dfe3e7;
      --paper: #f7f8f5;
      --panel: #ffffff;
      --accent: #d9ff43;
      --accent-dark: #b9dc2d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(23, 25, 28, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(23, 25, 28, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: 1fr 0.8fr;
      background: var(--panel);
      border: 1px solid var(--ink);
      box-shadow: 12px 12px 0 var(--ink);
    }

    .calculator { padding: clamp(24px, 5vw, 48px); }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 16px 0 32px;
      color: var(--muted);
      font-size: 15px;
    }

    .fields { display: grid; gap: 18px; }

    label {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px;
      align-items: center;
      gap: 16px;
      font-weight: 750;
      font-size: 15px;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafbfa;
      color: var(--ink);
      font: 750 18px inherit;
      padding: 0 44px 0 14px;
      outline: none;
    }

    input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(217, 255, 67, 0.7); }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { appearance: none; margin: 0; }

    .unit {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    button {
      width: 100%;
      height: 56px;
      margin-top: 24px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: var(--accent);
      color: var(--ink);
      font-weight: 850;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    button:hover { background: #e4ff75; }
    button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

    .result-panel {
      min-height: 430px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 5vw, 48px);
      background: var(--ink);
      color: white;
    }

    .result-label {
      color: #c7ccd1;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .result {
      margin: 12px 0 0;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(64px, 10vw, 112px);
      line-height: 0.85;
      letter-spacing: 0;
    }

    .result small { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; color: white; }

    .details { border-top: 1px solid #454a50; padding-top: 18px; }
    .detail { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; font-size: 14px; }
    .detail span:first-child { color: #c7ccd1; }
    .detail strong { text-align: right; }

    .error { min-height: 20px; margin: 12px 0 -8px; color: #b42318; font-size: 13px; }

    @media (max-width: 720px) {
      body { align-items: start; padding: 12px; }
      main { grid-template-columns: 1fr; box-shadow: 7px 7px 0 var(--ink); }
      .result-panel { min-height: 280px; }
      label { grid-template-columns: minmax(0, 1fr) 130px; }
    }

    @media (max-width: 430px) {
      label { grid-template-columns: 1fr; gap: 8px; }
      .input-wrap { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <section class="calculator" aria-labelledby="title">
      <h1 id="title">Calculadora<br>de 1RM</h1>
      <p class="subtitle">Convierte tu carga conocida a otro porcentaje.</p>

      <form id="calculator" novalidate>
        <div class="fields">
          <label>
            <span>% trabajado</span>
            <span class="input-wrap">
              <input id="workedPercent" type="number" inputmode="decimal" min="0.1" max="100" step="0.1" value="80" aria-label="Porcentaje trabajado">
              <span class="unit">%</span>
            </span>
          </label>

          <label>
            <span>Peso trabajado</span>
            <span class="input-wrap">
              <input id="workedWeight" type="number" inputmode="decimal" min="0.1" step="0.5" value="100" aria-label="Peso trabajado">
              <span class="unit">kg</span>
            </span>
          </label>

          <label>
            <span>% a calcular</span>
            <span class="input-wrap">
              <input id="targetPercent" type="number" inputmode="decimal" min="0.1" max="100" step="0.1" value="60" aria-label="Porcentaje a calcular">
              <span class="unit">%</span>
            </span>
          </label>
        </div>

        <p id="error" class="error" role="alert"></p>
        <button type="submit">Calcular peso</button>
      </form>
    </section>

    <aside class="result-panel" aria-live="polite">
      <div>
        <div class="result-label">Peso calculado</div>
        <p class="result"><span id="result">75</span> <small>kg</small></p>
      </div>
      <div class="details">
        <div class="detail">
          <span>1RM estimado</span>
          <strong id="oneRm">125 kg</strong>
        </div>
        <div class="detail">
          <span>Datos usados</span>
          <strong id="usedData">80% × 100 kg</strong>
        </div>
      </div>
    </aside>
  </main>

  <script>
    const form = document.getElementById('calculator');
    const workedPercentInput = document.getElementById('workedPercent');
    const workedWeightInput = document.getElementById('workedWeight');
    const targetPercentInput = document.getElementById('targetPercent');
    const resultElement = document.getElementById('result');
    const oneRmElement = document.getElementById('oneRm');
    const usedDataElement = document.getElementById('usedData');
    const errorElement = document.getElementById('error');

    function formatNumber(value) {
      return new Intl.NumberFormat('es-ES', {
        maximumFractionDigits: 2,
        minimumFractionDigits: Number.isInteger(value) ? 0 : 1
      }).format(value);
    }

    function calculate() {
      const workedPercent = Number(workedPercentInput.value);
      const workedWeight = Number(workedWeightInput.value);
      const targetPercent = Number(targetPercentInput.value);

      if (!Number.isFinite(workedPercent) || workedPercent <= 0 || workedPercent > 100) {
        errorElement.textContent = 'Introduce un porcentaje trabajado entre 0,1 y 100.';
        return;
      }
      if (!Number.isFinite(workedWeight) || workedWeight <= 0) {
        errorElement.textContent = 'Introduce un peso válido mayor que 0.';
        return;
      }
      if (!Number.isFinite(targetPercent) || targetPercent <= 0 || targetPercent > 100) {
        errorElement.textContent = 'Introduce un porcentaje objetivo entre 0,1 y 100.';
        return;
      }

      errorElement.textContent = '';
      const oneRm = workedWeight / (workedPercent / 100);
      const targetWeight = oneRm * (targetPercent / 100);

      resultElement.textContent = formatNumber(targetWeight);
      oneRmElement.textContent = `${formatNumber(oneRm)} kg`;
      usedDataElement.textContent = `${formatNumber(workedPercent)}% × ${formatNumber(workedWeight)} kg`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      calculate();
    });

    [workedPercentInput, workedWeightInput, targetPercentInput].forEach((input) => {
      input.addEventListener('input', calculate);
    });

    calculate();
  </script>
</body>
</html>
